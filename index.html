<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pote da Gratidão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#241d22;
    --bg-2:#332622;
    --glass:#e0a75e;
    --glass-dark:#b97a35;
    --paper:#f6efdd;
    --paper-shadow:#d8cbaa;
    --honey:#e8b86d;
    --ink:#2b2438;
    --muted:#cbb9a4;
    --muted-dim:#9c8873;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% 8%, rgba(224,167,94,0.16) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 90%, rgba(185,122,53,0.10) 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    color:var(--muted);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 70% 15%, rgba(255,255,255,0.25), transparent),
      radial-gradient(1px 1px at 85% 45%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 12% 65%, rgba(255,255,255,0.2), transparent),
      radial-gradient(1.5px 1.5px at 40% 80%, rgba(255,255,255,0.25), transparent),
      radial-gradient(1px 1px at 92% 75%, rgba(255,255,255,0.2), transparent);
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:520px;
    margin:0 auto;
    padding:44px 24px 80px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .eyebrow{
    font-family:'Inter', sans-serif;
    font-size:11.5px;
    font-weight:500;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--honey);
    margin-bottom:10px;
    opacity:0.85;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-style:italic;
    font-size:44px;
    color:#f4ecd8;
    margin:0 0 8px;
    text-align:center;
    letter-spacing:0.01em;
  }

  .sub{
    text-align:center;
    font-size:14.5px;
    color:var(--muted-dim);
    max-width:340px;
    line-height:1.5;
    margin-bottom:8px;
  }

  .count{
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:28px;
    letter-spacing:0.02em;
  }
  .count b{ color:var(--honey); font-weight:600; }

  /* JAR */
  .jar-stage{
    position:relative;
    width:260px;
    height:300px;
    margin-bottom:30px;
  }

  .jar-glow{
    position:absolute;
    inset:-50px;
    background:radial-gradient(ellipse at 50% 55%, rgba(232,184,109,0.28), rgba(224,167,94,0.08) 45%, transparent 70%);
    filter:blur(8px);
  }

  svg.jar-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
  }

  .notes-layer{
    position:absolute;
    left:0; right:0;
    bottom:34px;
    height:198px;
    overflow:hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0px, black 14px);
    mask-image: linear-gradient(to bottom, transparent 0px, black 14px);
  }

  .note-chip{
    position:absolute;
    width:22px;
    height:16px;
    background:linear-gradient(135deg, var(--paper), var(--paper-shadow));
    border-radius:2px;
    box-shadow:0 1px 2px rgba(0,0,0,0.25);
    opacity:0;
    animation: dropIn 0.7s cubic-bezier(.2,.9,.3,1.2) forwards;
  }

  @keyframes dropIn{
    0%{ transform: translateY(-160px) rotate(0deg) scale(0.8); opacity:0; }
    60%{ opacity:1; }
    100%{ transform: translateY(0) rotate(var(--rot,0deg)) scale(1); opacity:1; }
  }

  .empty-msg{
    position:absolute;
    left:50%; bottom:50px;
    transform:translateX(-50%);
    width:150px;
    text-align:center;
    font-size:12px;
    color:var(--muted-dim);
    font-style:italic;
    line-height:1.5;
  }

  /* FORM */
  .card{
    width:100%;
    background:linear-gradient(160deg, rgba(232,184,109,0.09), rgba(232,184,109,0.03));
    border:1px solid rgba(232,184,109,0.22);
    border-radius:22px;
    padding:20px 20px 18px;
    backdrop-filter:blur(6px);
    box-shadow:0 12px 30px rgba(30,18,10,0.25), inset 0 1px 0 rgba(255,235,205,0.06);
    margin-bottom:14px;
  }

  .suggest-row{
    margin-bottom:12px;
  }

  .btn-suggest{
    background:rgba(232,184,109,0.12);
    color:var(--honey);
    border:1px solid rgba(232,184,109,0.3);
    padding:6px 13px;
    border-radius:999px;
    font-size:12px;
  }
  .btn-suggest:hover{ background:rgba(232,184,109,0.2); }

  .suggest-text{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:16.5px;
    color:var(--muted);
    margin-top:10px;
    line-height:1.4;
    min-height:0;
    cursor:pointer;
  }
  .suggest-text:empty{ display:none; }
  .suggest-text .tag{
    display:block;
    font-family:'Inter', sans-serif;
    font-style:normal;
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted-dim);
    margin-bottom:3px;
  }
  .suggest-hint{
    display:block;
    font-family:'Inter', sans-serif;
    font-style:normal;
    font-size:10.5px;
    color:var(--muted-dim);
    margin-top:5px;
  }

  textarea{
    width:100%;
    min-height:64px;
    resize:none;
    background:transparent;
    border:none;
    outline:none;
    color:#f2e4c6;
    font-family:'Space Mono', monospace;
    font-size:14.5px;
    line-height:1.7;
    letter-spacing:-0.01em;
    padding:0;
    caret-color:var(--honey);
  }
  textarea::placeholder{ color:var(--muted-dim); opacity:0.75; font-style:italic; }

  .card-foot{
    display:flex;
    justify-content:flex-end;
    margin-top:10px;
  }

  button{
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:13.5px;
    letter-spacing:0.02em;
    cursor:pointer;
    border:none;
    outline:none;
    transition:transform 0.15s ease, opacity 0.15s ease;
  }
  button:active{ transform:scale(0.96); }
  button:focus-visible{ outline:2px solid var(--honey); outline-offset:2px; }

  .btn-primary{
    background:linear-gradient(135deg, var(--honey), var(--glass-dark));
    color:#2b2438;
    font-weight:600;
    padding:9px 20px;
    border-radius:999px;
  }
  .btn-primary:disabled{ opacity:0.35; cursor:default; }

  .btn-ghost{
    background:rgba(232,184,109,0.05);
    color:var(--muted);
    border:1px solid rgba(203,185,164,0.28);
    padding:11px 20px;
    border-radius:999px;
    width:100%;
  }
  .btn-ghost:hover{ border-color:var(--honey); color:var(--honey); }

  .actions{ width:100%; margin-top:4px; }

  /* MODAL - drawn note */
  .veil{
    position:fixed; inset:0;
    background:rgba(20,16,28,0.72);
    backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center;
    z-index:10;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
    padding:24px;
  }
  .veil.show{ opacity:1; pointer-events:auto; }

  .drawn-note{
    background:linear-gradient(160deg, var(--paper), var(--paper-shadow));
    color:#3a2f22;
    width:100%;
    max-width:320px;
    border-radius:4px;
    padding:34px 26px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    transform:scale(0.85) rotate(-1.5deg);
    transition:transform 0.35s cubic-bezier(.2,.9,.3,1.3);
    position:relative;
  }
  .veil.show .drawn-note{ transform:scale(1) rotate(-1deg); }

  .drawn-note::before{
    content:'';
    position:absolute; inset:10px;
    border:1px dashed rgba(58,47,34,0.15);
    border-radius:2px;
    pointer-events:none;
  }

  .drawn-label{
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:10.5px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:#a1855a;
    margin-bottom:14px;
  }

  .drawn-text{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size:24px;
    line-height:1.5;
    color:#3a2f22;
  }

  .drawn-date{
    font-family:'Inter', sans-serif;
    font-size:10.5px;
    color:#a1855a;
    margin-top:16px;
  }

  .close-x{
    margin-top:22px;
    background:transparent;
    color:#8a6f45;
    font-family:'Inter', sans-serif;
    font-size:12px;
    text-decoration:underline;
    text-underline-offset:3px;
  }

  .toast{
    position:fixed;
    bottom:26px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#f4ecd8;
    color:#2b2438;
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:13px;
    padding:10px 18px;
    border-radius:999px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
    opacity:0;
    transition:all 0.3s ease;
    z-index:20;
    pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){
    .note-chip{ animation:none; opacity:1; }
    .drawn-note, .veil{ transition:none; }
  }
</style>
</head>
<body>

<div class="stars"></div>

<div class="wrap">
  <div class="eyebrow">um ritual diário</div>
  <h1>Pote da Gratidão</h1>
  <p class="sub">Guarde aqui um motivo de cada dia. Quando precisar de luz, tire um papelzinho e leia de novo.</p>
  <div class="count" id="count">o pote está vazio</div>

  <div class="jar-stage">
    <div class="jar-glow"></div>
    <svg class="jar-svg" viewBox="0 0 260 300" fill="none">
      <defs>
        <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f0c98a" stop-opacity="0.22"/>
          <stop offset="45%" stop-color="#e0a75e" stop-opacity="0.10"/>
          <stop offset="100%" stop-color="#b97a35" stop-opacity="0.16"/>
        </linearGradient>
        <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#a9835a"/>
          <stop offset="100%" stop-color="#6b4c2d"/>
        </linearGradient>
      </defs>
      <!-- lid -->
      <rect x="88" y="18" width="84" height="20" rx="6" fill="url(#lidGrad)"/>
      <rect x="94" y="10" width="72" height="14" rx="6" fill="#7d5a35"/>
      <!-- jar body -->
      <path d="M96 38
               L92 66
               C74 78 62 108 62 148
               L62 236
               C62 262 82 282 130 282
               C178 282 198 262 198 236
               L198 148
               C198 108 186 78 168 66
               L164 38
               Z"
            fill="url(#glassGrad)"
            stroke="rgba(244,236,216,0.35)"
            stroke-width="2"/>
      <!-- shine -->
      <path d="M84 90 C74 118 72 160 74 210" stroke="rgba(255,255,255,0.25)" stroke-width="5" stroke-linecap="round" fill="none"/>
    </svg>
    <div class="notes-layer" id="notesLayer"></div>
    <div class="empty-msg" id="emptyMsg">ainda não há<br>nenhum papelzinho aqui</div>
  </div>

  <div class="card">
    <div class="suggest-row">
      <button class="btn-suggest" id="suggestBtn">✦ me dá uma ideia</button>
      <div class="suggest-text" id="suggestText"></div>
    </div>
    <textarea id="noteInput" placeholder="Hoje eu sou grata por…" maxlength="200"></textarea>
    <div class="card-foot">
      <button class="btn-primary" id="saveBtn" disabled>Guardar no pote</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn-ghost" id="drawBtn">Tirar um papel do pote</button>
  </div>
</div>

<div class="veil" id="veil">
  <div class="drawn-note">
    <div class="drawn-label">você guardou isto</div>
    <div class="drawn-text" id="drawnText">—</div>
    <div class="drawn-date" id="drawnDate"></div>
    <button class="close-x" id="closeBtn">dobrar e guardar de volta</button>
  </div>
</div>

<div class="toast" id="toast">guardado no pote ✦</div>

<script>
(function(){
  const STORAGE_KEY = 'gratitude-notes';
  const notesLayer = document.getElementById('notesLayer');
  const emptyMsg = document.getElementById('emptyMsg');
  const countEl = document.getElementById('count');
  const input = document.getElementById('noteInput');
  const saveBtn = document.getElementById('saveBtn');
  const drawBtn = document.getElementById('drawBtn');
  const veil = document.getElementById('veil');
  const drawnText = document.getElementById('drawnText');
  const drawnDate = document.getElementById('drawnDate');
  const closeBtn = document.getElementById('closeBtn');
  const toast = document.getElementById('toast');
  const suggestBtn = document.getElementById('suggestBtn');
  const suggestText = document.getElementById('suggestText');

  let notes = [];

  const suggestions = [
    { tag: 'Pessoas', text: 'Alguém que te ouviu de verdade essa semana' },
    { tag: 'Pessoas', text: 'Uma pessoa da equipe que fez o dia mais leve' },
    { tag: 'Pessoas', text: 'Alguém que você ama e sabe que pode contar' },
    { tag: 'Pequenos prazeres', text: 'Um cheiro, gosto ou som que te fez sorrir hoje' },
    { tag: 'Pequenos prazeres', text: 'Um momento de silêncio que você conseguiu ter' },
    { tag: 'Pequenos prazeres', text: 'Uma xícara de café ou chá no tempo certo' },
    { tag: 'Conquistas', text: 'Algo que você terminou e tava adiando' },
    { tag: 'Conquistas', text: 'Um problema que você resolveu sozinha hoje' },
    { tag: 'Conquistas', text: 'Um passo pequeno que te aproximou de um objetivo' },
    { tag: 'Corpo e saúde', text: 'Algo que seu corpo fez por você hoje' },
    { tag: 'Corpo e saúde', text: 'Uma noite de sono ou descanso que fez diferença' },
    { tag: 'Casa e conforto', text: 'Um lugar onde você se sente segura' },
    { tag: 'Casa e conforto', text: 'Algo simples que tornou seu dia mais confortável' },
    { tag: 'Trabalho', text: 'Algo na padaria que te deu orgulho hoje' },
    { tag: 'Trabalho', text: 'Um cliente ou momento que lembrou por que você faz isso' },
    { tag: 'Natureza', text: 'Um pedaço de céu, planta ou luz que você reparou' },
    { tag: 'Fé', text: 'Um momento em que você se sentiu cuidada' },
    { tag: 'Fé', text: 'Algo que parecia impossível e se resolveu' },
    { tag: 'Passado recente', text: 'Uma lembrança boa que voltou à mente essa semana' },
    { tag: 'Você mesma', text: 'Algo que você fez por si mesma, sem culpa' }
  ];

  let lastSuggestion = null;

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 1800);
  }

  function fmtDate(iso){
    try{
      const d = new Date(iso);
      return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' });
    }catch(e){ return ''; }
  }

  function updateCount(){
    if(notes.length === 0){
      countEl.textContent = 'o pote está vazio';
      emptyMsg.style.display = 'block';
    } else {
      countEl.innerHTML = notes.length === 1
        ? '<b>1</b> lembrança guardada'
        : '<b>' + notes.length + '</b> lembranças guardadas';
      emptyMsg.style.display = 'none';
    }
  }

  function renderChip(){
    const chip = document.createElement('div');
    chip.className = 'note-chip';
    const left = 15 + Math.random() * 65; // percent
    const bottom = Math.random() * 130;
    const rot = (Math.random() * 50 - 25).toFixed(1);
    chip.style.left = left + '%';
    chip.style.bottom = bottom + 'px';
    chip.style.setProperty('--rot', rot + 'deg');
    chip.style.background = Math.random() > 0.5
      ? 'linear-gradient(135deg, #f6efdd, #d8cbaa)'
      : 'linear-gradient(135deg, #f0dfb0, #cbb37e)';
    notesLayer.appendChild(chip);
  }

  function renderAllChips(){
    notesLayer.innerHTML = '';
    // cap visual chips for performance/clarity, show most recent 40
    const toShow = notes.slice(-40);
    toShow.forEach(()=> {
      const chip = document.createElement('div');
      chip.className = 'note-chip';
      chip.style.animation = 'none';
      chip.style.opacity = '1';
      const left = 15 + Math.random() * 65;
      const bottom = Math.random() * 130;
      const rot = (Math.random() * 50 - 25).toFixed(1);
      chip.style.left = left + '%';
      chip.style.bottom = bottom + 'px';
      chip.style.transform = 'rotate(' + rot + 'deg)';
      chip.style.background = Math.random() > 0.5
        ? 'linear-gradient(135deg, #f6efdd, #d8cbaa)'
        : 'linear-gradient(135deg, #f0dfb0, #cbb37e)';
      notesLayer.appendChild(chip);
    });
  }

  async function loadNotes(){
    try{
      const result = await window.storage.get(STORAGE_KEY, false);
      notes = result && result.value ? JSON.parse(result.value) : [];
    }catch(e){
      notes = [];
    }
    renderAllChips();
    updateCount();
  }

  async function persistNotes(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(notes), false);
    }catch(e){
      console.error('Erro ao salvar', e);
    }
  }

  async function addNote(){
    const text = input.value.trim();
    if(!text) return;
    notes.push({ text, date: new Date().toISOString() });
    input.value = '';
    saveBtn.disabled = true;
    renderChip();
    updateCount();
    await persistNotes();
    showToast('guardado no pote ✦');
  }

  function drawNote(){
    if(notes.length === 0){
      showToast('o pote ainda está vazio');
      return;
    }
    const pick = notes[Math.floor(Math.random() * notes.length)];
    drawnText.textContent = pick.text;
    drawnDate.textContent = fmtDate(pick.date);
    veil.classList.add('show');
  }

  function closeDrawn(){
    veil.classList.remove('show');
  }

  function showSuggestion(){
    let pick = suggestions[Math.floor(Math.random() * suggestions.length)];
    // evita repetir a mesma sugestão duas vezes seguidas
    if(suggestions.length > 1 && lastSuggestion && pick.text === lastSuggestion.text){
      pick = suggestions[(suggestions.indexOf(pick) + 1) % suggestions.length];
    }
    lastSuggestion = pick;
    suggestText.innerHTML = '<span class="tag">' + pick.tag + '</span>' + pick.text +
      '<span class="suggest-hint">toque para usar essa ideia</span>';
  }

  suggestBtn.addEventListener('click', showSuggestion);

  suggestText.addEventListener('click', () => {
    if(!lastSuggestion) return;
    input.value = lastSuggestion.text + ': ';
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    saveBtn.disabled = input.value.trim().length === 0;
  });

  input.addEventListener('input', () => {
    saveBtn.disabled = input.value.trim().length === 0;
  });

  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
      addNote();
    }
  });

  saveBtn.addEventListener('click', addNote);
  drawBtn.addEventListener('click', drawNote);
  closeBtn.addEventListener('click', closeDrawn);
  veil.addEventListener('click', (e) => { if(e.target === veil) closeDrawn(); });

  loadNotes();
})();
</script>

</body>
</html>
