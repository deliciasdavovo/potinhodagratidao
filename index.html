<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pote da Gratidão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eeeeec;
    --bg-soft:#f6f6f4;
    --ink:#292827;
    --muted:#74716d;
    --muted-dim:#9a9691;
    --line:#d9d7d2;
    --card:#fafaf8;
    --paper:#f7efdc;
    --paper-shadow:#dccba8;
    --honey:#b99158;
    --honey-dark:#8a673c;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(255,255,255,.92) 0%, rgba(255,255,255,.2) 45%, transparent 70%),
      linear-gradient(180deg, #f2f2f0 0%, var(--bg) 58%, #e9e9e6 100%);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .wrap{
    position:relative;
    max-width:520px;
    margin:0 auto;
    padding:42px 24px 80px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .eyebrow{
    font-size:11px;
    font-weight:600;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--honey-dark);
    margin-bottom:9px;
  }

  h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-style:italic;
    font-size:44px;
    line-height:1;
    margin:0 0 10px;
    text-align:center;
    color:#2e2c2a;
  }

  .sub{
    margin:0 0 8px;
    max-width:355px;
    text-align:center;
    font-size:14px;
    line-height:1.55;
    color:var(--muted);
  }

  .count{
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:20px;
  }
  .count b{color:var(--honey-dark);font-weight:600;}

  /* POTE — proporções inspiradas no pote cilíndrico de vidro da referência */
  .jar-stage{
    position:relative;
    width:280px;
    height:330px;
    margin:0 0 28px;
    filter:drop-shadow(0 18px 17px rgba(54,52,48,.13));
  }

  .jar-floor{
    position:absolute;
    left:44px;
    right:44px;
    bottom:10px;
    height:20px;
    border-radius:50%;
    background:radial-gradient(ellipse, rgba(70,68,64,.18), rgba(70,68,64,0) 70%);
    filter:blur(5px);
  }

  svg.jar-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
  }

  .notes-layer{
    position:absolute;
    left:61px;
    right:61px;
    bottom:35px;
    height:215px;
    overflow:hidden;
    clip-path:polygon(13% 16%, 22% 8%, 31% 0, 69% 0, 78% 8%, 87% 16%, 100% 31%, 100% 100%, 0 100%, 0 31%);
    z-index:2;
  }

  .note-chip{
    position:absolute;
    width:24px;
    height:17px;
    border-radius:2px;
    border:1px solid rgba(116,94,58,.12);
    box-shadow:0 1px 3px rgba(55,49,39,.17);
    opacity:0;
    animation:dropIn .7s cubic-bezier(.2,.9,.3,1.2) forwards;
  }

  .note-chip::after{
    content:'';
    position:absolute;
    left:5px;
    right:5px;
    top:7px;
    border-top:1px solid rgba(122,101,67,.16);
  }

  @keyframes dropIn{
    0%{transform:translateY(-180px) rotate(0deg) scale(.82);opacity:0;}
    58%{opacity:1;}
    100%{transform:translateY(0) rotate(var(--rot,0deg)) scale(1);opacity:1;}
  }

  .empty-msg{
    position:absolute;
    z-index:3;
    left:50%;
    bottom:84px;
    transform:translateX(-50%);
    width:150px;
    text-align:center;
    font-family:'Cormorant Garamond',serif;
    font-size:15px;
    font-style:italic;
    line-height:1.3;
    color:#8f8b86;
    pointer-events:none;
  }

  .card{
    width:100%;
    background:rgba(250,250,248,.92);
    border:1px solid var(--line);
    border-radius:20px;
    padding:19px 20px 17px;
    box-shadow:0 10px 30px rgba(52,49,45,.08), inset 0 1px 0 rgba(255,255,255,.8);
    margin-bottom:13px;
  }

  .suggest-row{margin-bottom:12px;}

  .btn-suggest{
    background:#f2eee7;
    color:var(--honey-dark);
    border:1px solid #ded5c6;
    padding:6px 13px;
    border-radius:999px;
    font-size:12px;
  }
  .btn-suggest:hover{background:#ebe4d8;}

  .suggest-text{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:16.5px;
    color:#58534c;
    margin-top:10px;
    line-height:1.4;
    cursor:pointer;
  }
  .suggest-text:empty{display:none;}
  .suggest-text .tag{
    display:block;
    font-family:'Inter',sans-serif;
    font-style:normal;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#908b84;
    margin-bottom:3px;
  }
  .suggest-hint{
    display:block;
    font-family:'Inter',sans-serif;
    font-style:normal;
    font-size:10.5px;
    color:#a39f99;
    margin-top:5px;
  }

  textarea{
    width:100%;
    min-height:64px;
    resize:none;
    background:transparent;
    border:none;
    outline:none;
    color:#302e2b;
    font-family:'Space Mono',monospace;
    font-size:14px;
    line-height:1.7;
    padding:0;
    caret-color:var(--honey-dark);
  }
  textarea::placeholder{color:#9c9892;opacity:.85;font-style:italic;}

  .card-foot{display:flex;justify-content:flex-end;margin-top:10px;}

  button{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:13.5px;
    letter-spacing:.01em;
    cursor:pointer;
    border:none;
    outline:none;
    transition:transform .15s ease,opacity .15s ease,background .15s ease;
  }
  button:active{transform:scale(.97);}
  button:focus-visible{outline:2px solid var(--honey-dark);outline-offset:2px;}

  .btn-primary{
    background:#373533;
    color:#fff;
    font-weight:600;
    padding:9px 20px;
    border-radius:999px;
  }
  .btn-primary:hover{background:#22211f;}
  .btn-primary:disabled{opacity:.3;cursor:default;}

  .actions{width:100%;margin-top:4px;}
  .btn-ghost{
    width:100%;
    background:rgba(255,255,255,.45);
    color:#5f5b56;
    border:1px solid #d6d3cf;
    padding:11px 20px;
    border-radius:999px;
  }
  .btn-ghost:hover{background:rgba(255,255,255,.8);border-color:#bbb7b0;}

  .veil{
    position:fixed;
    inset:0;
    background:rgba(38,37,35,.46);
    backdrop-filter:blur(4px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    padding:24px;
  }
  .veil.show{opacity:1;pointer-events:auto;}

  .drawn-note{
    background:linear-gradient(160deg,var(--paper),var(--paper-shadow));
    color:#3a2f22;
    width:100%;
    max-width:320px;
    border-radius:4px;
    padding:34px 26px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.28);
    transform:scale(.85) rotate(-1.5deg);
    transition:transform .35s cubic-bezier(.2,.9,.3,1.3);
    position:relative;
  }
  .veil.show .drawn-note{transform:scale(1) rotate(-1deg);}
  .drawn-note::before{
    content:'';
    position:absolute;
    inset:10px;
    border:1px dashed rgba(58,47,34,.15);
    border-radius:2px;
    pointer-events:none;
  }
  .drawn-label{
    font-size:10.5px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:#a1855a;
    margin-bottom:14px;
  }
  .drawn-text{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:500;
    font-size:24px;
    line-height:1.5;
    color:#3a2f22;
  }
  .drawn-date{font-size:10.5px;color:#a1855a;margin-top:16px;}
  .close-x{
    margin-top:22px;
    background:transparent;
    color:#806943;
    font-size:12px;
    text-decoration:underline;
    text-underline-offset:3px;
  }

  .toast{
    position:fixed;
    bottom:26px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#353330;
    color:#fff;
    font-size:13px;
    padding:10px 18px;
    border-radius:999px;
    box-shadow:0 8px 24px rgba(0,0,0,.2);
    opacity:0;
    transition:all .3s ease;
    z-index:20;
    pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(max-width:420px){
    .wrap{padding-top:34px;}
    h1{font-size:40px;}
    .jar-stage{transform:scale(.95);margin-top:-8px;margin-bottom:16px;}
  }

  @media(prefers-reduced-motion:reduce){
    .note-chip{animation:none;opacity:1;}
    .drawn-note,.veil{transition:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">um ritual diário</div>
  <h1>Pote da Gratidão</h1>
  <p class="sub">Guarde aqui um motivo de cada dia. Quando precisar de luz, tire um papelzinho e leia de novo.</p>
  <div class="count" id="count">o pote está vazio</div>

  <div class="jar-stage" aria-label="Pote de vidro com bilhetes de gratidão">
    <div class="jar-floor"></div>
    <svg class="jar-svg" viewBox="0 0 280 330" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="glassBody" x1="55" y1="88" x2="226" y2="287" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".42"/>
          <stop offset=".22" stop-color="#e9eff0" stop-opacity=".15"/>
          <stop offset=".58" stop-color="#ffffff" stop-opacity=".06"/>
          <stop offset="1" stop-color="#cbd1d1" stop-opacity=".18"/>
        </linearGradient>
        <linearGradient id="glassEdge" x1="64" y1="80" x2="218" y2="289" gradientUnits="userSpaceOnUse">
          <stop stop-color="#a9afb0" stop-opacity=".62"/>
          <stop offset=".5" stop-color="#fdfdfd" stop-opacity=".92"/>
          <stop offset="1" stop-color="#9da4a5" stop-opacity=".5"/>
        </linearGradient>
        <linearGradient id="metal" x1="78" y1="28" x2="200" y2="67" gradientUnits="userSpaceOnUse">
          <stop stop-color="#a9aba8"/>
          <stop offset=".12" stop-color="#f5f5f0"/>
          <stop offset=".34" stop-color="#c2c3bf"/>
          <stop offset=".54" stop-color="#f8f8f4"/>
          <stop offset=".76" stop-color="#b9bab6"/>
          <stop offset="1" stop-color="#e7e7e2"/>
        </linearGradient>
        <linearGradient id="metalDark" x1="84" y1="58" x2="198" y2="72" gradientUnits="userSpaceOnUse">
          <stop stop-color="#8e908d"/>
          <stop offset=".5" stop-color="#d9dad6"/>
          <stop offset="1" stop-color="#8f918e"/>
        </linearGradient>
        <linearGradient id="baseGlass" x1="70" y1="279" x2="210" y2="296" gradientUnits="userSpaceOnUse">
          <stop stop-color="#9da4a4" stop-opacity=".4"/>
          <stop offset=".5" stop-color="#fff" stop-opacity=".75"/>
          <stop offset="1" stop-color="#9ca3a3" stop-opacity=".4"/>
        </linearGradient>
      </defs>

      <!-- corpo de vidro: laterais mais retas e ombros suaves como a referência -->
      <path d="M91 68
               C91 78 86 83 78 89
               C69 96 65 107 65 123
               L65 260
               C65 276 76 287 92 291
               C113 296 167 296 188 291
               C204 287 215 276 215 260
               L215 123
               C215 107 211 96 202 89
               C194 83 189 78 189 68
               Z"
            fill="url(#glassBody)"
            stroke="url(#glassEdge)"
            stroke-width="2.1"/>

      <!-- espessura do fundo -->
      <path d="M70 275 C84 291 196 291 210 275 C208 291 198 298 184 301 C162 305 118 305 96 301 C82 298 72 291 70 275Z"
            fill="url(#baseGlass)" opacity=".55"/>
      <path d="M81 286 C105 294 175 294 199 286" stroke="#7e8585" stroke-opacity=".3" stroke-width="1.4" stroke-linecap="round"/>

      <!-- reflexos no vidro -->
      <path d="M82 105 C75 132 76 218 81 253" stroke="#fff" stroke-opacity=".48" stroke-width="6" stroke-linecap="round"/>
      <path d="M91 96 C86 114 86 142 87 159" stroke="#fff" stroke-opacity=".62" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M201 112 C207 150 205 215 201 246" stroke="#737a7b" stroke-opacity=".12" stroke-width="3" stroke-linecap="round"/>
      <path d="M102 73 C116 77 164 77 178 73" stroke="#a5abad" stroke-opacity=".34" stroke-width="1.4"/>

      <!-- tampa rosqueável metálica -->
      <ellipse cx="140" cy="31" rx="58" ry="9" fill="#efefeb" stroke="#a4a5a1" stroke-width="1.5"/>
      <path d="M82 31 L82 58 C82 66 91 70 140 70 C189 70 198 66 198 58 L198 31 C191 38 89 38 82 31Z"
            fill="url(#metal)" stroke="#969895" stroke-width="1.4"/>
      <ellipse cx="140" cy="31" rx="57" ry="8" fill="url(#metal)"/>
      <ellipse cx="140" cy="32" rx="49" ry="5.7" stroke="#fff" stroke-opacity=".58"/>
      <path d="M83 58 C97 64 183 64 197 58 L197 65 C183 72 97 72 83 65Z" fill="url(#metalDark)" opacity=".9"/>

      <!-- frisos da tampa -->
      <g stroke="#7f817e" stroke-opacity=".32" stroke-width="1">
        <path d="M90 38V61"/><path d="M96 39V62"/><path d="M102 40V63"/><path d="M108 40V64"/>
        <path d="M114 40V64"/><path d="M120 41V65"/><path d="M126 41V65"/><path d="M132 41V65"/>
        <path d="M138 41V65"/><path d="M144 41V65"/><path d="M150 41V65"/><path d="M156 41V65"/>
        <path d="M162 41V65"/><path d="M168 40V64"/><path d="M174 40V64"/><path d="M180 39V63"/>
        <path d="M186 38V62"/><path d="M192 37V60"/>
      </g>
      <path d="M86 49 C106 54 174 54 194 49" stroke="#fff" stroke-opacity=".52" stroke-width="1.5"/>
    </svg>

    <div class="notes-layer" id="notesLayer"></div>
    <div class="empty-msg" id="emptyMsg">ainda não há<br>nenhum papelzinho aqui</div>
  </div>

  <div class="card">
    <div class="suggest-row">
      <button class="btn-suggest" id="suggestBtn">✦ me dá uma ideia</button>
      <div class="suggest-text" id="suggestText"></div>
    </div>
    <textarea id="noteInput" placeholder="Hoje eu sou grata por…" maxlength="200"></textarea>
    <div class="card-foot">
      <button class="btn-primary" id="saveBtn" disabled>Guardar no pote</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn-ghost" id="drawBtn">Tirar um papel do pote</button>
  </div>
</div>

<div class="veil" id="veil">
  <div class="drawn-note">
    <div class="drawn-label">você guardou isto</div>
    <div class="drawn-text" id="drawnText">—</div>
    <div class="drawn-date" id="drawnDate"></div>
    <button class="close-x" id="closeBtn">dobrar e guardar de volta</button>
  </div>
</div>

<div class="toast" id="toast">guardado no pote ✦</div>

<script>
(function(){
  const STORAGE_KEY='gratitude-notes';
  const notesLayer=document.getElementById('notesLayer');
  const emptyMsg=document.getElementById('emptyMsg');
  const countEl=document.getElementById('count');
  const input=document.getElementById('noteInput');
  const saveBtn=document.getElementById('saveBtn');
  const drawBtn=document.getElementById('drawBtn');
  const veil=document.getElementById('veil');
  const drawnText=document.getElementById('drawnText');
  const drawnDate=document.getElementById('drawnDate');
  const closeBtn=document.getElementById('closeBtn');
  const toast=document.getElementById('toast');
  const suggestBtn=document.getElementById('suggestBtn');
  const suggestText=document.getElementById('suggestText');

  let notes=[];
  let lastSuggestion=null;

  const suggestions=[
    {tag:'Pessoas',text:'Alguém que te ouviu de verdade essa semana'},
    {tag:'Pessoas',text:'Uma pessoa da equipe que fez o dia mais leve'},
    {tag:'Pessoas',text:'Alguém que você ama e sabe que pode contar'},
    {tag:'Pequenos prazeres',text:'Um cheiro, gosto ou som que te fez sorrir hoje'},
    {tag:'Pequenos prazeres',text:'Um momento de silêncio que você conseguiu ter'},
    {tag:'Pequenos prazeres',text:'Uma xícara de café ou chá no tempo certo'},
    {tag:'Conquistas',text:'Algo que você terminou e tava adiando'},
    {tag:'Conquistas',text:'Um problema que você resolveu sozinha hoje'},
    {tag:'Conquistas',text:'Um passo pequeno que te aproximou de um objetivo'},
    {tag:'Corpo e saúde',text:'Algo que seu corpo fez por você hoje'},
    {tag:'Corpo e saúde',text:'Uma noite de sono ou descanso que fez diferença'},
    {tag:'Casa e conforto',text:'Um lugar onde você se sente segura'},
    {tag:'Casa e conforto',text:'Algo simples que tornou seu dia mais confortável'},
    {tag:'Trabalho',text:'Algo na padaria que te deu orgulho hoje'},
    {tag:'Trabalho',text:'Um cliente ou momento que lembrou por que você faz isso'},
    {tag:'Natureza',text:'Um pedaço de céu, planta ou luz que você reparou'},
    {tag:'Fé',text:'Um momento em que você se sentiu cuidada'},
    {tag:'Fé',text:'Algo que parecia impossível e se resolveu'},
    {tag:'Passado recente',text:'Uma lembrança boa que voltou à mente essa semana'},
    {tag:'Você mesma',text:'Algo que você fez por si mesma, sem culpa'}
  ];

  function showToast(msg){
    toast.textContent=msg;
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'),1800);
  }

  function fmtDate(iso){
    try{
      return new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
    }catch(e){return '';}
  }

  function loadNotes(){
    try{
      const saved=localStorage.getItem(STORAGE_KEY);
      const parsed=saved?JSON.parse(saved):[];
      notes=Array.isArray(parsed)?parsed:[];
    }catch(e){
      console.warn('Não foi possível ler os bilhetes salvos.',e);
      notes=[];
    }
    renderAllChips();
    updateCount();
  }

  function persistNotes(){
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify(notes));
      return true;
    }catch(e){
      console.error('Não foi possível salvar no localStorage.',e);
      showToast('não consegui salvar neste navegador');
      return false;
    }
  }

  function updateCount(){
    if(notes.length===0){
      countEl.textContent='o pote está vazio';
      emptyMsg.style.display='block';
    }else{
      countEl.innerHTML=notes.length===1
        ? '<b>1</b> lembrança guardada'
        : '<b>'+notes.length+'</b> lembranças guardadas';
      emptyMsg.style.display='none';
    }
  }

  function chipStyle(chip,index,animated){
    const seed=(index+1)*37;
    const left=6+((seed*17)%76);
    const bottom=5+((seed*29)%156);
    const rot=((seed*13)%50)-25;
    chip.style.left=left+'%';
    chip.style.bottom=bottom+'px';
    chip.style.setProperty('--rot',rot+'deg');
    chip.style.background=((index%3)===0)
      ? 'linear-gradient(135deg,#f8f0dd,#dccaa4)'
      : ((index%3)===1)
        ? 'linear-gradient(135deg,#fff9e9,#e3d4b5)'
        : 'linear-gradient(135deg,#efe5c9,#d2bd92)';
    if(!animated){
      chip.style.animation='none';
      chip.style.opacity='1';
      chip.style.transform='rotate('+rot+'deg)';
    }
  }

  function renderChip(){
    const chip=document.createElement('div');
    chip.className='note-chip';
    chipStyle(chip,notes.length-1,true);
    notesLayer.appendChild(chip);
  }

  function renderAllChips(){
    notesLayer.innerHTML='';
    const start=Math.max(0,notes.length-45);
    notes.slice(start).forEach((_,i)=>{
      const chip=document.createElement('div');
      chip.className='note-chip';
      chipStyle(chip,start+i,false);
      notesLayer.appendChild(chip);
    });
  }

  function addNote(){
    const text=input.value.trim();
    if(!text)return;

    const note={
      id:(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(16).slice(2),
      text,
      date:new Date().toISOString()
    };

    notes.push(note);
    if(!persistNotes()){
      notes.pop();
      return;
    }

    input.value='';
    saveBtn.disabled=true;
    renderChip();
    updateCount();
    showToast('guardado no pote ✦');
  }

  function drawNote(){
    if(notes.length===0){
      showToast('o pote ainda está vazio');
      return;
    }
    const pick=notes[Math.floor(Math.random()*notes.length)];
    drawnText.textContent=pick.text;
    drawnDate.textContent=fmtDate(pick.date);
    veil.classList.add('show');
  }

  function closeDrawn(){veil.classList.remove('show');}

  function showSuggestion(){
    let pick=suggestions[Math.floor(Math.random()*suggestions.length)];
    if(suggestions.length>1&&lastSuggestion&&pick.text===lastSuggestion.text){
      pick=suggestions[(suggestions.indexOf(pick)+1)%suggestions.length];
    }
    lastSuggestion=pick;
    suggestText.innerHTML='<span class="tag">'+pick.tag+'</span>'+pick.text+
      '<span class="suggest-hint">toque para usar essa ideia</span>';
  }

  suggestBtn.addEventListener('click',showSuggestion);
  suggestText.addEventListener('click',()=>{
    if(!lastSuggestion)return;
    input.value=lastSuggestion.text+': ';
    input.focus();
    input.setSelectionRange(input.value.length,input.value.length);
    saveBtn.disabled=false;
  });
  input.addEventListener('input',()=>{saveBtn.disabled=input.value.trim().length===0;});
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))addNote();
  });
  saveBtn.addEventListener('click',addNote);
  drawBtn.addEventListener('click',drawNote);
  closeBtn.addEventListener('click',closeDrawn);
  veil.addEventListener('click',e=>{if(e.target===veil)closeDrawn();});

  loadNotes();
})();
</script>
</body>
</html>
