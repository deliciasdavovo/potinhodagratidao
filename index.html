<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pote da Gratidão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdfaf5;
    --bg-warm:#f7eee1;
    --card:#ffffff;
    --ink:#4a3b30;
    --ink-soft:#6d5c4e;
    --muted:#9d8b79;
    --honey:#d2913f;
    --honey-deep:#b4762a;
    --paper:#f7e7c8;
    --paper-2:#eed6a8;
    --line:rgba(74,59,48,0.10);
    --line-strong:rgba(74,59,48,0.16);
    --shadow:0 18px 40px -22px rgba(90,66,40,0.38);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--bg);
    color:var(--ink-soft);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{ overflow:hidden; }

  /* luz quente de fundo */
  .glowfield{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    background:
      radial-gradient(60% 55% at 78% 30%, rgba(232,178,102,0.22) 0%, transparent 70%),
      radial-gradient(45% 45% at 12% 78%, rgba(233,196,150,0.18) 0%, transparent 72%),
      linear-gradient(170deg, #fffdf9 0%, var(--bg-warm) 100%);
  }

  .wrap{
    position:relative;
    z-index:1;
    height:100%;
    max-width:1080px;
    margin:0 auto;
    padding:clamp(18px,3.4vh,44px) clamp(20px,4.5vw,56px);
    display:grid;
    grid-template-columns:minmax(0,1.05fr) minmax(0,0.95fr);
    grid-template-areas:
      "head jar"
      "form jar";
    align-content:center;
    column-gap:clamp(24px,5vw,64px);
    row-gap:clamp(14px,2.4vh,24px);
  }

  .head{ grid-area:head; min-width:0; }
  .form{ grid-area:form; min-width:0; }

  .jar-col{
    grid-area:jar;
    align-self:center;
    justify-self:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:0;
  }

  .eyebrow{
    font-size:11px;
    font-weight:500;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--honey-deep);
    margin-bottom:10px;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-style:italic;
    font-size:clamp(29px,3.7vw,42px);
    line-height:1.05;
    color:var(--ink);
    margin:0 0 10px;
    letter-spacing:0.005em;
  }

  .sub{
    font-size:clamp(13.5px,1.1vw,15px);
    color:var(--ink-soft);
    max-width:38ch;
    line-height:1.6;
    margin:0 0 clamp(16px,2.6vh,26px);
  }

  .count{
    font-size:12.5px;
    color:var(--muted);
    letter-spacing:0.02em;
    margin-top:14px;
    text-align:center;
  }
  .count b{ color:var(--honey-deep); font-weight:600; }

  /* POTE */
  .jar-stage{
    position:relative;
    --jar-h:clamp(230px,46vh,340px);
    height:var(--jar-h);
    width:calc(var(--jar-h) * 0.867);
  }

  .jar-glow{
    position:absolute;
    inset:-14% -20%;
    background:radial-gradient(ellipse at 50% 58%, rgba(233,175,95,0.30), rgba(233,175,95,0.10) 48%, transparent 72%);
    filter:blur(10px);
  }

  svg.jar-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
  }

  .notes-layer{
    position:absolute;
    left:0; right:0;
    bottom:11.5%;
    height:66%;
    overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0px, black 14px);
    mask-image:linear-gradient(to bottom, transparent 0px, black 14px);
  }

  .note-chip{
    position:absolute;
    width:calc(var(--jar-h) * 0.065);
    height:calc(var(--jar-h) * 0.047);
    background:linear-gradient(135deg, var(--paper), var(--paper-2));
    border-radius:2px;
    box-shadow:0 1px 3px rgba(120,90,50,0.22), inset 0 0 0 1px rgba(255,255,255,0.45);
    opacity:0;
    animation:dropIn 0.7s cubic-bezier(.2,.9,.3,1.2) forwards;
  }

  @keyframes dropIn{
    0%{ transform:translateY(-160px) rotate(0deg) scale(0.8); opacity:0; }
    60%{ opacity:1; }
    100%{ transform:translateY(0) rotate(var(--rot,0deg)) scale(1); opacity:1; }
  }

  .empty-msg{
    position:absolute;
    left:50%; bottom:26%;
    transform:translateX(-50%);
    width:50%;
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-size:13px;
    color:var(--muted);
    font-style:italic;
    line-height:1.4;
  }

  /* FORMULÁRIO */
  .card{
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:clamp(14px,2vh,20px) 18px;
    box-shadow:var(--shadow);
  }

  .btn-suggest{
    background:rgba(210,145,63,0.10);
    color:var(--honey-deep);
    border:1px solid rgba(210,145,63,0.26);
    padding:6px 14px;
    border-radius:999px;
    font-size:12px;
  }
  .btn-suggest:hover{ background:rgba(210,145,63,0.18); }

  .suggest-text{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:16px;
    color:var(--ink);
    margin-top:9px;
    line-height:1.35;
    min-height:46px;
    cursor:pointer;
  }
  .suggest-text:empty{ cursor:default; }
  .suggest-text:empty::before{
    content:'sem pressa — toque no botão se quiser um empurrãozinho';
    font-size:14px;
    color:var(--muted);
  }
  .suggest-text .tag{
    display:block;
    font-family:'Inter', sans-serif;
    font-style:normal;
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:3px;
  }
  .suggest-hint{
    display:block;
    font-family:'Inter', sans-serif;
    font-style:normal;
    font-size:10.5px;
    color:var(--muted);
    margin-top:4px;
  }

  .divider{
    height:1px;
    background:var(--line);
    margin:12px 0;
  }

  textarea{
    width:100%;
    min-height:clamp(54px,8vh,80px);
    resize:none;
    background:transparent;
    border:none;
    outline:none;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    line-height:1.65;
    padding:0;
    caret-color:var(--honey-deep);
  }
  textarea::placeholder{
    color:var(--muted);
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:17px;
  }

  .card-foot{
    display:flex;
    justify-content:flex-end;
    margin-top:8px;
  }

  button{
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:13.5px;
    letter-spacing:0.02em;
    cursor:pointer;
    border:none;
    outline:none;
    transition:transform 0.15s ease, opacity 0.15s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  button:active{ transform:scale(0.97); }
  button:focus-visible{ outline:2px solid var(--honey); outline-offset:2px; }

  .btn-primary{
    background:linear-gradient(135deg, var(--honey), var(--honey-deep));
    color:#fffaf1;
    font-weight:600;
    padding:9px 20px;
    border-radius:999px;
    box-shadow:0 8px 18px -10px rgba(180,118,42,0.9);
  }
  .btn-primary:disabled{ opacity:0.32; cursor:default; box-shadow:none; }

  .btn-ghost{
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--line-strong);
    padding:11px 20px;
    border-radius:999px;
    width:100%;
  }
  .btn-ghost:hover{ border-color:var(--honey); color:var(--honey-deep); background:rgba(210,145,63,0.06); }

  .actions{ width:100%; margin-top:10px; }

  /* MODAL */
  .veil{
    position:fixed; inset:0;
    background:rgba(74,59,48,0.30);
    backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    z-index:10;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
    padding:24px;
  }
  .veil.show{ opacity:1; pointer-events:auto; }

  .drawn-note{
    background:linear-gradient(160deg, #fffdf7, #f6e9d1);
    color:var(--ink);
    width:100%;
    max-width:330px;
    border-radius:6px;
    padding:34px 26px;
    text-align:center;
    box-shadow:0 26px 60px -20px rgba(90,66,40,0.55);
    transform:scale(0.9) rotate(-1.5deg);
    transition:transform 0.35s cubic-bezier(.2,.9,.3,1.3);
    position:relative;
  }
  .veil.show .drawn-note{ transform:scale(1) rotate(-1deg); }

  .drawn-note::before{
    content:'';
    position:absolute; inset:10px;
    border:1px dashed rgba(120,90,50,0.22);
    border-radius:3px;
    pointer-events:none;
  }

  .drawn-label{
    font-weight:500;
    font-size:10.5px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--honey-deep);
    margin-bottom:14px;
  }

  .drawn-text{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size:24px;
    line-height:1.5;
    color:var(--ink);
  }

  .drawn-date{
    font-size:10.5px;
    color:var(--muted);
    margin-top:16px;
  }

  .close-x{
    margin-top:22px;
    background:transparent;
    color:var(--muted);
    font-size:12px;
    text-decoration:underline;
    text-underline-offset:3px;
  }

  .toast{
    position:fixed;
    bottom:26px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fdf7ec;
    font-weight:500;
    font-size:13px;
    padding:10px 18px;
    border-radius:999px;
    box-shadow:0 12px 30px -12px rgba(74,59,48,0.7);
    opacity:0;
    transition:all 0.3s ease;
    z-index:20;
    pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* telas estreitas ou baixas: pote menor, ao lado do título */
  @media (max-width:860px), (max-height:600px){
    .wrap{
      grid-template-columns:minmax(0,1fr) auto;
      grid-template-areas:
        "head jar"
        "form form";
      column-gap:clamp(14px,3vw,26px);
      row-gap:clamp(14px,2.6vh,24px);
      padding:clamp(18px,3vh,32px) clamp(18px,5vw,28px);
    }
    .jar-col{ align-self:start; max-width:44vw; }
    .jar-stage{ --jar-h:clamp(150px,24vh,210px); }
    .sub{ max-width:none; }
    .count{ margin-top:10px; font-size:11.5px; }
    .empty-msg{ font-size:11.5px; }
  }

  /* espaço muito curto: libera a rolagem em vez de espremer */
  @media (max-height:480px){
    body{ overflow:auto; }
    .wrap{ height:auto; min-height:100%; }
  }

  @media (prefers-reduced-motion: reduce){
    .note-chip{ animation:none; opacity:1; }
    .drawn-note, .veil, button{ transition:none; }
  }
</style>
</head>
<body>

<div class="glowfield"></div>

<main class="wrap">
  <header class="head">
    <div class="eyebrow">um ritual diário</div>
    <h1>Pote da Gratidão</h1>
    <p class="sub">Guarde aqui um motivo de cada dia. Quando precisar de luz, tire um papelzinho e leia de novo.</p>
  </header>

  <section class="form">
    <div class="card">
      <button class="btn-suggest" id="suggestBtn">✦ me dá uma ideia</button>
      <div class="suggest-text" id="suggestText"></div>
      <div class="divider"></div>
      <textarea id="noteInput" placeholder="Hoje eu sou grata por…" maxlength="200"></textarea>
      <div class="card-foot">
        <button class="btn-primary" id="saveBtn" disabled>Guardar no pote</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn-ghost" id="drawBtn">Tirar um papel do pote</button>
    </div>
  </section>

  <aside class="jar-col">
    <div class="jar-stage">
      <div class="jar-glow"></div>
      <svg class="jar-svg" viewBox="0 0 260 300" fill="none">
        <defs>
          <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
            <stop offset="45%" stop-color="#f3dfbc" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#e3bd85" stop-opacity="0.40"/>
          </linearGradient>
          <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e2be89"/>
            <stop offset="100%" stop-color="#b98d55"/>
          </linearGradient>
        </defs>
        <!-- tampa -->
        <rect x="88" y="18" width="84" height="20" rx="6" fill="url(#lidGrad)"/>
        <rect x="94" y="10" width="72" height="14" rx="6" fill="#cfa66f"/>
        <!-- corpo -->
        <path d="M96 38
                 L92 66
                 C74 78 62 108 62 148
                 L62 236
                 C62 262 82 282 130 282
                 C178 282 198 262 198 236
                 L198 148
                 C198 108 186 78 168 66
                 L164 38
                 Z"
              fill="url(#glassGrad)"
              stroke="rgba(150,113,68,0.38)"
              stroke-width="2"/>
        <!-- brilho -->
        <path d="M84 90 C74 118 72 160 74 210" stroke="rgba(255,255,255,0.85)" stroke-width="5" stroke-linecap="round" fill="none"/>
      </svg>
      <div class="notes-layer" id="notesLayer"></div>
      <div class="empty-msg" id="emptyMsg">ainda não há<br>nenhum papelzinho aqui</div>
    </div>
    <div class="count" id="count">o pote está vazio</div>
  </aside>
</main>

<div class="veil" id="veil">
  <div class="drawn-note">
    <div class="drawn-label">você guardou isto</div>
    <div class="drawn-text" id="drawnText">—</div>
    <div class="drawn-date" id="drawnDate"></div>
    <button class="close-x" id="closeBtn">dobrar e guardar de volta</button>
  </div>
</div>

<div class="toast" id="toast">guardado no pote ✦</div>

<script>
(function(){
  const STORAGE_KEY = 'gratitude-notes';
  const notesLayer = document.getElementById('notesLayer');
  const emptyMsg = document.getElementById('emptyMsg');
  const countEl = document.getElementById('count');
  const input = document.getElementById('noteInput');
  const saveBtn = document.getElementById('saveBtn');
  const drawBtn = document.getElementById('drawBtn');
  const veil = document.getElementById('veil');
  const drawnText = document.getElementById('drawnText');
  const drawnDate = document.getElementById('drawnDate');
  const closeBtn = document.getElementById('closeBtn');
  const toast = document.getElementById('toast');
  const suggestBtn = document.getElementById('suggestBtn');
  const suggestText = document.getElementById('suggestText');

  let notes = [];

  const suggestions = [
    { tag: 'Pessoas', text: 'Alguém que te ouviu de verdade essa semana' },
    { tag: 'Pessoas', text: 'Uma pessoa da equipe que fez o dia mais leve' },
    { tag: 'Pessoas', text: 'Alguém que você ama e sabe que pode contar' },
    { tag: 'Pequenos prazeres', text: 'Um cheiro, gosto ou som que te fez sorrir hoje' },
    { tag: 'Pequenos prazeres', text: 'Um momento de silêncio que você conseguiu ter' },
    { tag: 'Pequenos prazeres', text: 'Uma xícara de café ou chá no tempo certo' },
    { tag: 'Conquistas', text: 'Algo que você terminou e tava adiando' },
    { tag: 'Conquistas', text: 'Um problema que você resolveu sozinha hoje' },
    { tag: 'Conquistas', text: 'Um passo pequeno que te aproximou de um objetivo' },
    { tag: 'Corpo e saúde', text: 'Algo que seu corpo fez por você hoje' },
    { tag: 'Corpo e saúde', text: 'Uma noite de sono ou descanso que fez diferença' },
    { tag: 'Casa e conforto', text: 'Um lugar onde você se sente segura' },
    { tag: 'Casa e conforto', text: 'Algo simples que tornou seu dia mais confortável' },
    { tag: 'Trabalho', text: 'Algo na padaria que te deu orgulho hoje' },
    { tag: 'Trabalho', text: 'Um cliente ou momento que lembrou por que você faz isso' },
    { tag: 'Natureza', text: 'Um pedaço de céu, planta ou luz que você reparou' },
    { tag: 'Fé', text: 'Um momento em que você se sentiu cuidada' },
    { tag: 'Fé', text: 'Algo que parecia impossível e se resolveu' },
    { tag: 'Passado recente', text: 'Uma lembrança boa que voltou à mente essa semana' },
    { tag: 'Você mesma', text: 'Algo que você fez por si mesma, sem culpa' }
  ];

  let lastSuggestion = null;

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 1800);
  }

  function fmtDate(iso){
    try{
      const d = new Date(iso);
      return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' });
    }catch(e){ return ''; }
  }

  function updateCount(){
    if(notes.length === 0){
      countEl.textContent = 'o pote está vazio';
      emptyMsg.style.display = 'block';
    } else {
      countEl.innerHTML = notes.length === 1
        ? '<b>1</b> lembrança guardada'
        : '<b>' + notes.length + '</b> lembranças guardadas';
      emptyMsg.style.display = 'none';
    }
  }

  // posiciona o papelzinho dentro do vidro (tudo em %, para acompanhar o tamanho do pote)
  function makeChip(){
    const chip = document.createElement('div');
    chip.className = 'note-chip';
    const left = 26 + Math.random() * 44;   // faixa interna do vidro
    const bottom = Math.random() * 42;      // se acomodam no fundo
    const rot = (Math.random() * 50 - 25).toFixed(1);
    chip.style.left = left + '%';
    chip.style.bottom = bottom + '%';
    chip.style.setProperty('--rot', rot + 'deg');
    chip.style.background = Math.random() > 0.5
      ? 'linear-gradient(135deg, #f6dfb2, #e3c084)'
      : 'linear-gradient(135deg, #f2d5a2, #dcb473)';
    return chip;
  }

  function renderChip(){
    notesLayer.appendChild(makeChip());
  }

  function renderAllChips(){
    notesLayer.innerHTML = '';
    // cap visual chips for performance/clarity, show most recent 40
    notes.slice(-40).forEach(()=> {
      const chip = makeChip();
      chip.style.animation = 'none';
      chip.style.opacity = '1';
      chip.style.transform = 'rotate(' + chip.style.getPropertyValue('--rot') + ')';
      notesLayer.appendChild(chip);
    });
  }

  async function loadNotes(){
    try{
      const result = await window.storage.get(STORAGE_KEY, false);
      notes = result && result.value ? JSON.parse(result.value) : [];
    }catch(e){
      notes = [];
    }
    renderAllChips();
    updateCount();
  }

  async function persistNotes(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(notes), false);
    }catch(e){
      console.error('Erro ao salvar', e);
    }
  }

  async function addNote(){
    const text = input.value.trim();
    if(!text) return;
    notes.push({ text, date: new Date().toISOString() });
    input.value = '';
    saveBtn.disabled = true;
    renderChip();
    updateCount();
    await persistNotes();
    showToast('guardado no pote ✦');
  }

  function drawNote(){
    if(notes.length === 0){
      showToast('o pote ainda está vazio');
      return;
    }
    const pick = notes[Math.floor(Math.random() * notes.length)];
    drawnText.textContent = pick.text;
    drawnDate.textContent = fmtDate(pick.date);
    veil.classList.add('show');
  }

  function closeDrawn(){
    veil.classList.remove('show');
  }

  function showSuggestion(){
    let pick = suggestions[Math.floor(Math.random() * suggestions.length)];
    // evita repetir a mesma sugestão duas vezes seguidas
    if(suggestions.length > 1 && lastSuggestion && pick.text === lastSuggestion.text){
      pick = suggestions[(suggestions.indexOf(pick) + 1) % suggestions.length];
    }
    lastSuggestion = pick;
    suggestText.innerHTML = '<span class="tag">' + pick.tag + '</span>' + pick.text +
      '<span class="suggest-hint">toque para usar essa ideia</span>';
  }

  suggestBtn.addEventListener('click', showSuggestion);

  suggestText.addEventListener('click', () => {
    if(!lastSuggestion) return;
    input.value = lastSuggestion.text + ': ';
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    saveBtn.disabled = input.value.trim().length === 0;
  });

  input.addEventListener('input', () => {
    saveBtn.disabled = input.value.trim().length === 0;
  });

  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
      addNote();
    }
  });

  saveBtn.addEventListener('click', addNote);
  drawBtn.addEventListener('click', drawNote);
  closeBtn.addEventListener('click', closeDrawn);
  veil.addEventListener('click', (e) => { if(e.target === veil) closeDrawn(); });

  loadNotes();
})();
</script>

</body>
</html>
